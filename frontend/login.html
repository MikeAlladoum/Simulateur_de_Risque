<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Simulateur de Risque</title>
    <link rel="stylesheet" href="main.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #0F172A;
            font-weight: 700;
        }
        
        .login-header p {
            margin: 0;
            color: #64748B;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #0F172A;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #6366F1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366F1, #8B5CF6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .error-message {
            background: #FEE2E2;
            color: #DC2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #DC2626;
        }
        
        .success-message {
            background: #DCFCE7;
            color: #16A34A;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #16A34A;
        }
        
        .demo-info {
            background: #EFF6FF;
            color: #1E40AF;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            border-left: 4px solid #3B82F6;
        }
        
        .demo-info strong {
            display: block;
            margin-bottom: 8px;
        }
        
        .demo-user {
            margin: 4px 0;
            padding-left: 12px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 Connexion</h1>
            <p>Simulateur de Risque - v0.1</p>
        </div>
        
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">👤 Nom d'utilisateur</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="ex: demo"
                    required
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <label for="password">🔑 Mot de passe</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                Se connecter
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #94A3B8;">
            <span class="status-indicator"></span>
            Serveur: <span id="serverStatus">Verification...</span>
        </div>
    </div>
    
    <script src="init.js?v=1"></script>
    <script src="config.js?v=3"></script>
    <script src="js/auth.js?v=2"></script>
    <script>
        // Vérification du statut du serveur
        async function checkServerStatus() {
            try {
                const response = await fetch(`${CONFIG.API.BASE_URL.replace('/api', '')}/api/health`, {
                    timeout: 5000
                });
                if (response.ok) {
                    document.getElementById('serverStatus').textContent = 'En ligne ✅';
                }
            } catch (error) {
                document.getElementById('serverStatus').textContent = 'Hors ligne ⚠️';
            }
        }
        
        // Gestion du formulaire
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            
            // Validation
            if (!username || !password) {
                errorMsg.textContent = '❌ Veuillez remplir tous les champs';
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }
            
            // Loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            loginBtn.textContent = '⏳ Connexion...';
            
            try {
                const result = await AUTH.login(username, password);
                
                if (result.success) {
                    successMsg.textContent = `✅ ${result.message}`;
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    
                    // Redirection après 1 seconde
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 1000);
                } else {
                    errorMsg.textContent = `❌ ${result.error}`;
                    errorMsg.style.display = 'block';
                    successMsg.style.display = 'none';
                    
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = 'Se connecter';
                }
            } catch (error) {
                errorMsg.textContent = `❌ Erreur: ${error.message}`;
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Se connecter';
            }
        });
        
        // Redirection si déjà connecté
        if (AUTH.isAuthenticated()) {
            window.location.href = '/index.html';
        }
        
        // Vérification du serveur au chargement
        checkServerStatus();
    </script>
</body>
</html>
