services:
  - type: web
    name: simulateur-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///simulateur.db
